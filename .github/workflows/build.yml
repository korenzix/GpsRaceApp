name: Build Debug APK

# Runs automatically on every push, or manually from the Actions tab
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 — required by Android Gradle Plugin 8.x
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Install Gradle 8.6 (no wrapper JAR needed)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      # 4. Build the debug APK (no signing needed for testing)
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 6. Upload APK so you can download it from the Actions tab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GpsRace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
